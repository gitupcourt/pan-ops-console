# Dependabot — automated dependency update PRs.
#
# Part of Phase 2 (gitupcourt/homelab#118). Pairs with the security.yml
# dependency-audit jobs: pip-audit/npm audit tell us when something is
# vulnerable; Dependabot opens the PR that fixes it.
#
# Grouped minor+patch updates to keep PR volume sane on a solo-operated
# project — majors come as individual PRs (they're likelier to break and
# deserve individual review).

version: 2
updates:
  # --- Python backend ---
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # celery[redis] pulls in kombu[redis], which caps redis below 8.x. A
      # redis major bump therefore dies at `pip install` before a single test
      # runs, and nothing in this repo can fix it — it needs an upstream
      # Celery release. Drop this ignore once Celery supports redis 8.
      - dependency-name: "redis"
        update-types:
          - "version-update:semver-major"

  # --- React frontend ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # React and its type packages must move as a set: @types/react-dom
      # peer-depends on a matching @types/react, so a solo major bump of
      # either one fails `npm ci` before typecheck ever runs.
      # Declared before npm-minor-patch deliberately — Dependabot files a
      # dependency under the first group it matches, so this must win for
      # the react family.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions (pin/refresh action versions) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
