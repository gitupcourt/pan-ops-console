name: CI

# On every push and every PR, run tests. Then on push-to-main only,
# build images, push to GHCR, and open the manifest bump PR. PRs run
# tests but don't ship images — that's deliberate, both to save CI time
# and to keep GHCR free of speculative PR builds.
#
# See: https://github.com/gitupcourt/.github

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # =====================================================================
  # Tests — gates the rest of the pipeline. Must pass before any image
  # is built, and (once we add it to the branch ruleset) before the PR
  # can be merged at all.
  # =====================================================================
  test-backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        env:
          # Provide a Fernet key so app.config doesn't reject startup
          # during test collection (tests override this in conftest, but
          # collection happens before fixtures fire).
          FERNET_KEY: "0iJL2gP4XzVnQ5OYG9w7c-3RbWUf3jM0SQk5oN6E9Bs="
        run: pytest

  # =====================================================================
  # Backend image smoke test — build the actual production Dockerfile
  # and confirm `app.main` imports cleanly inside it. This catches
  # "things the docker-compose bind-mount masks" — the exact class of
  # bug that bit phase 2a (alembic/ + alembic.ini at /app got missed by
  # the COPY layer; only surfaced when the platform session tried to
  # roll out and the pod CrashLoopBackOff'd).
  #
  # Costs ~30-45s of CI; saves a multi-PR back-and-forth with the
  # platform session when something is missing from the image.
  # =====================================================================
  smoke-backend-image:
    name: backend image smoke
    needs: [test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pan-ops-console-backend:smoke backend/
      - name: Import every prod entry point + force mapper resolution
        # Covers three classes of bug:
        #   1. Source modules missing from the image (alembic/ caught
        #      via `import app.main` since lifespan imports alembic config).
        #   2. Operational script modules invoked as `python -m
        #      scripts.<name>` from a Job pod at cutover — NOT
        #      imported by app.main. See pan-ops-console#32.
        #   3. Worker entry point (`celery -A app.workers.celery_app
        #      worker`) has a DIFFERENT import graph than app.main. A
        #      SQLAlchemy relationship string like
        #      `relationship("Panorama", ...)` resolves lazily at
        #      mapper-configure time. If the worker's import chain
        #      doesn't load Panorama before mapper-configure, the
        #      first task execution dies (#39 — caught after phase-2e
        #      cutover landed in cluster). configure_mappers() forces
        #      resolution at smoke-time so this fails CI, not prod.
        run: |
          docker run --rm \
            -e FERNET_KEY="0iJL2gP4XzVnQ5OYG9w7c-3RbWUf3jM0SQk5oN6E9Bs=" \
            pan-ops-console-backend:smoke \
            python -c "
          import app.main
          import scripts.migrate_sqlite_to_postgres
          import scripts.rotate_fernet
          import app.workers.celery_app
          from sqlalchemy.orm import configure_mappers
          configure_mappers()
          print('app.main + scripts + app.workers.celery_app + configure_mappers OK')
          "
      - name: Verify alembic.ini + alembic/ + scripts/ are present in image
        run: |
          docker run --rm pan-ops-console-backend:smoke \
            sh -c "test -f /app/alembic.ini && test -d /app/alembic && test -d /app/scripts && echo 'alembic + scripts assets present'"

  # =====================================================================
  # Postgres migration smoke — actually runs `alembic upgrade head`
  # against an ephemeral Postgres so dialect-specific DDL traps surface
  # in CI instead of at deploy time.
  #
  # Backstory (#100 / phase 12a): migration 0006 created an ENUM type
  # via raw DO-block, then used `sa.Enum(name, create_type=False)` on
  # the column. SQLAlchemy's `_on_table_create` event ignored the local
  # create_type=False (because the model-level Enum already on
  # Base.metadata shadowed it) and tried `CREATE TYPE` again at table-
  # create time → DuplicateObject → backend CrashLoopBackOff.
  #
  # Neither pytest nor `import app.main` would have caught this — both
  # exercise the ORM + import surface but never actually emit the DDL
  # against Postgres. This job does.
  # =====================================================================
  smoke-postgres-migrations:
    name: postgres migration smoke
    needs: [smoke-backend-image]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: panops
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: panops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pan-ops-console-backend:smoke backend/
      - name: alembic upgrade head against Postgres
        run: |
          docker run --rm \
            --network host \
            -e FERNET_KEY="0iJL2gP4XzVnQ5OYG9w7c-3RbWUf3jM0SQk5oN6E9Bs=" \
            -e DATABASE_URL="postgresql+psycopg://panops:smoke@127.0.0.1:5432/panops" \
            pan-ops-console-backend:smoke \
            alembic upgrade head
      - name: Verify head is the expected revision
        # Catches the "branched migrations" / "wrong down_revision" class
        # of bug where the chain is fine to upgrade but doesn't end where
        # it should.
        run: |
          docker run --rm \
            --network host \
            -e FERNET_KEY="0iJL2gP4XzVnQ5OYG9w7c-3RbWUf3jM0SQk5oN6E9Bs=" \
            -e DATABASE_URL="postgresql+psycopg://panops:smoke@127.0.0.1:5432/panops" \
            pan-ops-console-backend:smoke \
            alembic current

  # =====================================================================
  # Frontend type-check. Catches TS strict-mode errors (unused imports,
  # implicit any, type mismatches) in ~10s on every PR — cheap insurance
  # so we don't discover them 90 seconds into the docker prod build on
  # push-to-main.
  # =====================================================================
  test-frontend:
    name: frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck

  # =====================================================================
  # Build + push images and open the bump PR. Runs only on push to main
  # and only after both test jobs pass. PRs skip this entirely.
  # =====================================================================
  ship:
    needs: [test-backend, test-frontend, smoke-backend-image, smoke-postgres-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: gitupcourt/.github/.github/workflows/build-and-bump.yml@main
    with:
      app_name: pan-ops-console
      images: '[{"name":"backend","context":"backend"},{"name":"frontend","context":"frontend","dockerfile":"frontend/Dockerfile.prod"}]'
      manifest_dir: manifests/pan-ops-console
    secrets: inherit
