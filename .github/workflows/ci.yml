name: CI

# On every push and every PR, run tests. Then on push-to-main only,
# build images, push to GHCR, and open the manifest bump PR in
# gitupcourt/homelab. PRs run tests but don't ship images — that's
# deliberate, both to save CI time and to keep GHCR free of
# speculative PR builds.
#
# See: https://github.com/gitupcourt/.github

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # =====================================================================
  # Tests — gates the rest of the pipeline. Must pass before any image
  # is built. PRs get the same gate so a green PR check means "tests
  # passed", same as the eventual push-to-main run.
  # =====================================================================
  test-backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        # pan-os-python still imports distutils.version (removed in 3.12),
        # so we're pinned to 3.11 until the upstream library drops it.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        env:
          # app.config validates both keys at import time (Field(...,
          # min_length=32)). Tests don't actually use these — they're
          # consumed only when something tries to encrypt/decrypt creds
          # or sign a JWT, neither of which happens in the current test
          # suite — but module-level validation fires before any fixture
          # has a chance to substitute.
          FERNET_KEY: "0iJL2gP4XzVnQ5OYG9w7c-3RbWUf3jM0SQk5oN6E9Bs="
          SECRET_KEY: "ci-throwaway-secret-key-32chars-min-aaaaaaaaa"
        run: pytest

  test-frontend:
    name: frontend type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        # tsc is the only real "test" the frontend has today; catching
        # type drift before it lands on main is a strong return on the
        # ~30s the job costs.
        run: npx tsc -b --noEmit

  # =====================================================================
  # Build + push images and open the bump PR. Runs only on push to main
  # and only after tests pass. PRs skip this entirely.
  # =====================================================================
  ship:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: gitupcourt/.github/.github/workflows/build-and-bump.yml@main
    with:
      app_name: pan-fw-upgrader
      # Two images: the FastAPI/Celery backend (one image, three roles
      # — api, worker, beat — selected by the manifest's command/args)
      # and the nginx-served static frontend bundle. The frontend
      # explicitly names Dockerfile.prod so the dev-only Dockerfile
      # (Vite dev server) doesn't get pushed as the prod image.
      images: '[{"name":"backend","context":"backend"},{"name":"frontend","context":"frontend","dockerfile":"frontend/Dockerfile.prod"}]'
      manifest_dir: manifests/pan-fw-upgrader
    secrets: inherit
