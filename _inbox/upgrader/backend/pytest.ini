[pytest]
# Backend tests live under tests/. We import the live `app.*` package — that's
# the same module tree FastAPI loads, so a passing test means the imports
# actually work end-to-end.
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # SQLAlchemy 2.x is noisy about legacy patterns we don't trigger; quiet it
    # so real test failures stand out.
    ignore::DeprecationWarning:sqlalchemy.*
