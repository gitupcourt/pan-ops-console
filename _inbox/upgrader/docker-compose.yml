services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - images-data:/var/lib/panfw/images
    ports:
      - "8000:8000"
    # wait-for-mount.sh guards against the Docker-Desktop / WSL cold-boot
    # race where the bind mount isn't ready when the container starts.
    command: /usr/local/bin/wait-for-mount.sh uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - images-data:/var/lib/panfw/images
    # `watchmedo auto-restart` watches the source tree and bounces the worker
    # when any .py changes, so editing services / tasks doesn't leave a stale
    # in-memory copy running. (Celery itself doesn't have a --reload option.)
    command: >
      /usr/local/bin/wait-for-mount.sh
      watchmedo auto-restart --directory=/app --pattern="*.py" --recursive --
      celery -A app.celery_app.celery worker --loglevel=info --concurrency=8

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      /usr/local/bin/wait-for-mount.sh
      watchmedo auto-restart --directory=/app --pattern="*.py" --recursive --
      celery -A app.celery_app.celery beat --loglevel=info

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres-data:
  redis-data:
  images-data:
