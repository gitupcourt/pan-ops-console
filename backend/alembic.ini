# Alembic config — driven from app.config.Settings at runtime so DATABASE_URL
# is read from the same env var the FastAPI app uses. Keeps SQLite (today) and
# Postgres (phase 2b+) on the same migration tree.

[alembic]
script_location = alembic

# Migration filenames sort by timestamp then a short slug. Easier to read in
# `ls -la alembic/versions/` than the bare hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Default to UTC for timestamps in filenames so dev/prod machines on different
# TZs produce the same ordering.
timezone = UTC

# We don't set sqlalchemy.url here — env.py loads it from app.config.Settings.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
