# Capacity-analyzer metric catalog.
#
# Each entry pairs a "current value" fetch with a "max capacity" fetch and
# tells the poller how to extract a number from each response. The catalog
# is data, not code — edit this file to add a metric or fix a command.
#
# Extractor types:
#   xpath_count   — count of XPath matches
#   xpath_text    — float of the first XPath match's text
#   xpath_avg     — average of numeric text across ALL XPath matches
#   xpath_max     — maximum of numeric text across ALL XPath matches
#   state_value   — value of a key from `show system state` output
#                   (handles mixed decimal `10000` and hex `0x3e8`)
#   text_regex    — regex against <result> text; named group `value` is the number
#
# A metric's `current` or `max` can be either:
#   - A single fetcher: { cmd: ..., extract: {...} }
#   - A list summed across multiple commands:
#       sources:
#         - { cmd: ..., extract: {...} }
#         - { cmd: ..., extract: {...} }
#     Each source's value is added. Sources that error or return None
#     are skipped, so a `running` config source returning 0 through a
#     Panorama proxy doesn't break the metric on a different device that
#     CAN reach local config directly.
#
# Status:
#   verified   — confirmed against PAN-OS 11.x via Panorama proxy
#   probable   — based on docs / common knowledge; verify on first poll
#   needs_work — command/extractor is a guess and will likely need adjustment

version: 1

metrics:
  # =================================================================
  # Configuration Resource — current count vs. platform max
  # =================================================================
  # Pushed-shared-policy is the right view for Panorama-managed
  # firewalls — objects pushed from device-groups live under
  # /response/result/policy/panorama. Locally-defined objects (rare on
  # Panorama-managed devices) live under vsys1/address; we count both
  # using `.//address/entry`.

  - name: address_objects
    category: config
    description: Address objects (pushed + local)
    status: verified
    # Sum of Panorama-pushed objects (visible to both proxy and direct
    # polling) and locally-configured objects (only visible via direct
    # polling). When polling via Panorama proxy, the `running` source
    # returns 0 and the total reflects pushed only — a known limitation.
    current:
      sources:
        - cmd: "<show><config><pushed-shared-policy></pushed-shared-policy></config></show>"
          extract:
            type: xpath_count
            xpath: ".//address/entry"
        - cmd: "<show><config><running></running></config></show>"
          extract:
            type: xpath_count
            xpath: ".//vsys/entry/address/entry"
    max:
      cmd: "<show><system><state><filter>cfg.general.max-address</filter></state></system></show>"
      extract:
        type: state_value
        key: cfg.general.max-address

  - name: address_groups
    category: config
    description: Address groups (pushed + local)
    status: verified
    current:
      sources:
        - cmd: "<show><config><pushed-shared-policy></pushed-shared-policy></config></show>"
          extract:
            type: xpath_count
            xpath: ".//address-group/entry"
        - cmd: "<show><config><running></running></config></show>"
          extract:
            type: xpath_count
            xpath: ".//vsys/entry/address-group/entry"
    max:
      cmd: "<show><system><state><filter>cfg.general.max-address-group</filter></state></system></show>"
      extract:
        type: state_value
        key: cfg.general.max-address-group

  - name: fqdn_addresses
    category: config
    description: FQDN address objects (pushed + local; subset of address objects)
    status: verified
    # FQDN objects share the same capacity pool as other address objects
    # (no separate cfg.general.max-fqdn). The max here is intentionally
    # the address-object max so the chart shows progress toward the
    # shared ceiling.
    current:
      sources:
        - cmd: "<show><config><pushed-shared-policy></pushed-shared-policy></config></show>"
          extract:
            type: xpath_count
            xpath: ".//address/entry[fqdn]"
        - cmd: "<show><config><running></running></config></show>"
          extract:
            type: xpath_count
            xpath: ".//vsys/entry/address/entry[fqdn]"
    max:
      cmd: "<show><system><state><filter>cfg.general.max-address</filter></state></system></show>"
      extract:
        type: state_value
        key: cfg.general.max-address

  - name: service_objects
    category: config
    description: Service objects (pushed + local)
    status: verified
    current:
      sources:
        - cmd: "<show><config><pushed-shared-policy></pushed-shared-policy></config></show>"
          extract:
            type: xpath_count
            xpath: ".//service/entry"
        - cmd: "<show><config><running></running></config></show>"
          extract:
            type: xpath_count
            xpath: ".//vsys/entry/service/entry"
    max:
      cmd: "<show><system><state><filter>cfg.general.max-service</filter></state></system></show>"
      extract:
        type: state_value
        key: cfg.general.max-service

  - name: service_groups
    category: config
    description: Service groups (pushed + local)
    status: verified
    current:
      sources:
        - cmd: "<show><config><pushed-shared-policy></pushed-shared-policy></config></show>"
          extract:
            type: xpath_count
            xpath: ".//service-group/entry"
        - cmd: "<show><config><running></running></config></show>"
          extract:
            type: xpath_count
            xpath: ".//vsys/entry/service-group/entry"
    max:
      cmd: "<show><system><state><filter>cfg.general.max-service-group</filter></state></system></show>"
      extract:
        type: state_value
        key: cfg.general.max-service-group

  - name: security_policies
    category: config
    description: Security policy rules (pushed + local)
    status: verified
    # Pushed rules live under <pre-rulebase>/<security>/<rules> and the
    # matching post-rulebase path; local rules live under
    # vsys/entry/rulebase/security/rules. Recursive XPath catches all
    # of them in their respective sources.
    current:
      sources:
        - cmd: "<show><config><pushed-shared-policy></pushed-shared-policy></config></show>"
          extract:
            type: xpath_count
            xpath: ".//security/rules/entry"
        - cmd: "<show><config><running></running></config></show>"
          extract:
            type: xpath_count
            xpath: ".//vsys/entry/rulebase/security/rules/entry"
    max:
      cmd: "<show><system><state><filter>cfg.general.max-policy-rule</filter></state></system></show>"
      extract:
        type: state_value
        key: cfg.general.max-policy-rule

  - name: nat_policies
    category: config
    description: NAT policy rules (pushed + local)
    status: verified
    current:
      sources:
        - cmd: "<show><config><pushed-shared-policy></pushed-shared-policy></config></show>"
          extract:
            type: xpath_count
            xpath: ".//nat/rules/entry"
        - cmd: "<show><config><running></running></config></show>"
          extract:
            type: xpath_count
            xpath: ".//vsys/entry/rulebase/nat/rules/entry"
    max:
      cmd: "<show><system><state><filter>cfg.general.max-nat-policy-rule</filter></state></system></show>"
      extract:
        type: state_value
        key: cfg.general.max-nat-policy-rule

  - name: virtual_systems
    category: config
    description: Virtual systems (vsys) in use
    status: verified
    current:
      cmd: "<show><system><info></info></system></show>"
      extract:
        type: xpath_count
        xpath: ".//vsys/entry"
    max:
      cmd: "<show><system><state><filter>cfg.general.max-vsys</filter></state></system></show>"
      extract:
        type: state_value
        key: cfg.general.max-vsys

  - name: arp_entries
    category: config
    description: ARP table entries
    status: probable
    current:
      cmd: "<show><arp><entry name='all'/></arp></show>"
      extract:
        type: xpath_count
        xpath: ".//entries/entry"
    max:
      cmd: "<show><system><state><filter>cfg.general.max-arp</filter></state></system></show>"
      extract:
        type: state_value
        key: cfg.general.max-arp

  - name: ike_peers
    category: config
    description: IKE peers / gateways
    status: needs_work
    current:
      cmd: "<show><vpn><gateway></gateway></vpn></show>"
      extract:
        type: xpath_count
        xpath: ".//entry"
    max:
      cmd: "<show><system><state><filter>cfg.general.max-ike-peers</filter></state></system></show>"
      extract:
        type: state_value
        key: cfg.general.max-ike-peers

  - name: vpn_tunnels
    category: config
    description: IPsec VPN tunnels
    status: needs_work
    current:
      cmd: "<show><vpn><tunnel></tunnel></vpn></show>"
      extract:
        type: xpath_count
        xpath: ".//entry"
    max:
      cmd: "<show><system><state><filter>cfg.general.max-tunnel</filter></state></system></show>"
      extract:
        type: state_value
        key: cfg.general.max-tunnel

  - name: gp_clientless_vpn
    category: config
    description: GlobalProtect Clientless VPN connections
    status: needs_work
    current:
      cmd: "<show><global-protect-portal><current-user></current-user></global-protect-portal></show>"
      extract:
        type: xpath_count
        xpath: ".//entry"
    # No reliable max key — capped by max-ssl-tunnel on most platforms.

  # =================================================================
  # System Resource — utilization %
  # =================================================================

  - name: dp_cpu
    category: system
    description: Data plane CPU utilization (average across all DP cores)
    status: verified
    unit: percent
    # Average per-core load across EVERY data processor (dp0, dp1, ...) from the
    # 1-minute resource-monitor view — matches panos-upgrade-assurance's
    # get_dp_cpu_utilization (mean of all cores). The `*` wildcards the DP, so
    # single-DP and multi-DP boxes both work. NOTE: validated on single-DP
    # boxes; a chassis (e.g. PA-7000) may nest DPs per slot — confirm the XML
    # path against a real chassis before trusting it there.
    current:
      cmd: "<show><running><resource-monitor><minute><last>1</last></minute></resource-monitor></running></show>"
      extract:
        type: xpath_avg
        xpath: ".//data-processors/*/minute/cpu-load-average/entry/value"

  - name: dp_cpu_max
    category: system
    description: Data plane CPU utilization (hottest core across all DPs)
    status: verified
    unit: percent
    # The single busiest DP core — catches one pegged data processor that the
    # average would hide (matters on multi-DP / chassis boxes). Shares the
    # resource-monitor command with dp_cpu, so the response is fetched once and
    # cached; this metric adds no extra round-trip.
    current:
      cmd: "<show><running><resource-monitor><minute><last>1</last></minute></resource-monitor></running></show>"
      extract:
        type: xpath_max
        xpath: ".//data-processors/*/minute/cpu-load-average/entry/value"

  - name: mp_cpu
    category: system
    description: Management plane CPU utilization (%)
    status: verified
    unit: percent
    # The mgmt-plane CPU the firewall dashboard shows. NOTE: `show system
    # resources` (top -bn1) is unreliable for CPU — its first %Cpu(s) sample is
    # the average-since-boot, not the current load (it read ~83% on a box the
    # firewall reported at ~4%). Read the monitoring subsystem instead:
    # sys.monitor.<slot>.mp.exports carries { 'cpu': { '1minavg': N } } — the
    # same source panos-upgrade-assurance + the PAN-OS dashboard use. The slot
    # is s0 or s1 depending on platform, so wildcard it.
    current:
      cmd: "<show><system><state><filter>sys.monitor.*.mp.exports</filter></state></system></show>"
      extract:
        type: text_regex
        # CDATA: "sys.monitor.s1.mp.exports: { 'cpu': { '1minavg': 7, }, ... }"
        pattern: "'cpu':\\s*\\{[^}]*'1minavg':\\s*(?P<value>\\d+(?:\\.\\d+)?)"

  - name: mp_memory
    category: system
    description: Management plane memory utilization (%)
    status: verified
    unit: percent
    # `MiB Mem : 6959.1 total, 98.0 free, 2903.9 used, 3957.2 buff/cache`.
    # Capturing both `total` and `used` in one regex lets the extractor
    # turn this into a ratio percentage automatically.
    current:
      cmd: "<show><system><resources></resources></system></show>"
      extract:
        type: text_regex
        pattern: 'MiB Mem :\s+(?P<total>\d+(?:\.\d+)?)\s+total,\s+\S+\s+free,\s+(?P<value>\d+(?:\.\d+)?)\s+used'

  # =================================================================
  # Traffic Resource
  # =================================================================

  - name: session_table_utilization
    category: traffic
    description: Active sessions vs. session table maximum
    status: verified
    current:
      cmd: "<show><session><info></info></session></show>"
      extract:
        type: xpath_text
        xpath: ".//num-active"
    max:
      cmd: "<show><session><info></info></session></show>"
      extract:
        type: xpath_text
        xpath: ".//num-max"

  - name: decryption_sessions
    category: traffic
    description: Concurrent SSL decryption sessions
    status: needs_work
    # `show session info` on 11.x doesn't expose `num-active-ssl-proxy`
    # any more. Likely candidates:
    #   <show><session><meter></meter></session></show>
    #   <show><global-counter><filter><value>0</value></filter></global-counter></show>
    current:
      cmd: "<show><session><info></info></session></show>"
      extract:
        type: xpath_text
        xpath: ".//num-active-ssl-proxy"
