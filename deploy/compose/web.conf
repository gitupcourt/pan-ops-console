# Compose-only frontend nginx config: serve the SPA AND proxy /api -> backend.
# In Kubernetes the Ingress does the /api routing (stripPrefix), so this file
# is not used there. Mounted over /etc/nginx/conf.d/app.conf by docker-compose.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /api/* -> backend. The trailing slash on proxy_pass strips the /api prefix,
  # so /api/devices reaches the backend as /devices (its routes are unprefixed) —
  # the same effect as the cluster Ingress's stripPrefix middleware.
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;   # long enough for upgrade ops + slow firewalls
  }

  location = /healthz { return 200 "ok\n"; }

  # Hashed assets cache hard; everything else falls back to index.html (SPA).
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
