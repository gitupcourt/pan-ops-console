apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pan-capacity-data-dev
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pan-capacity-backend-dev
  namespace: default
  labels: { app: pan-capacity-dev, tier: backend }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: pan-capacity-dev, tier: backend } }
  template:
    metadata: { labels: { app: pan-capacity-dev, tier: backend } }
    spec:
      containers:
        - name: backend
          image: pan-capacity-backend-dev  # Tilt will rewrite this
          ports: [{ containerPort: 8000 }]
          env:
            - { name: DATABASE_URL, value: "sqlite:////app/data/capacity.db" }
            - { name: CATALOG_PATH, value: "/app/catalog/metrics.yaml" }
            - { name: POLL_INTERVAL_SECONDS, value: "300" }
            - { name: CORS_ORIGINS, value: "https://capacity-dev.apps.courtlukens.com" }
            - name: FERNET_KEY
              valueFrom: { secretKeyRef: { name: pan-capacity-secrets, key: FERNET_KEY } }
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: catalog, mountPath: /app/catalog }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: pan-capacity-data-dev } }
        - { name: catalog, configMap: { name: pan-capacity-catalog } }
---
apiVersion: v1
kind: Service
metadata: { name: pan-capacity-backend-dev, namespace: default }
spec:
  selector: { app: pan-capacity-dev, tier: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
