apiVersion: apps/v1
kind: Deployment
metadata:
  name: pan-capacity-frontend-dev
  namespace: default
  labels: { app: pan-capacity-dev, tier: frontend }
spec:
  replicas: 1
  selector: { matchLabels: { app: pan-capacity-dev, tier: frontend } }
  template:
    metadata: { labels: { app: pan-capacity-dev, tier: frontend } }
    spec:
      containers:
        - name: frontend
          image: pan-capacity-frontend-dev  # Tilt rewrites
          ports: [{ containerPort: 5173 }]
---
apiVersion: v1
kind: Service
metadata: { name: pan-capacity-frontend-dev, namespace: default }
spec:
  selector: { app: pan-capacity-dev, tier: frontend }
  ports: [{ port: 80, targetPort: 5173 }]
