apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pan-capacity-api-dev
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [capacity-dev.apps.courtlukens.com], secretName: wildcard-apps-courtlukens-tls }]
  rules:
    - host: capacity-dev.apps.courtlukens.com
      http: { paths: [{ path: /api, pathType: Prefix, backend: { service: { name: pan-capacity-backend-dev, port: { number: 8000 } } } }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pan-capacity-web-dev
  namespace: default
  annotations: { traefik.ingress.kubernetes.io/router.entrypoints: websecure }
spec:
  ingressClassName: traefik
  tls: [{ hosts: [capacity-dev.apps.courtlukens.com], secretName: wildcard-apps-courtlukens-tls }]
  rules:
    - host: capacity-dev.apps.courtlukens.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: pan-capacity-frontend-dev, port: { number: 80 } } } }] }
