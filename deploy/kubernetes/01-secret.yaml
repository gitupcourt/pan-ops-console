# Plaintext Secret TEMPLATE — fill the REPLACE_ME values, then apply.
# Fine for trying the app out. For anything real, use Sealed Secrets instead
# (see the "Secrets" section in README.md) so you never commit a plaintext key.
apiVersion: v1
kind: Secret
metadata:
  name: pan-ops-console-secrets
  labels: { app: pan-ops-console }
type: Opaque
stringData:
  # Encrypts stored firewall / Panorama API credentials at rest.
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # Losing it makes every stored credential unrecoverable — back it up separately.
  FERNET_KEY: REPLACE_ME_WITH_A_REAL_FERNET_KEY
  # Postgres — used by the postgres container AND by every app component.
  POSTGRES_USER: panops
  POSTGRES_DB: panops
  POSTGRES_PASSWORD: REPLACE_ME_WITH_A_REAL_POSTGRES_PASSWORD
  # Redis — Celery broker + coordination locks.
  REDIS_PASSWORD: REPLACE_ME_WITH_A_REAL_REDIS_PASSWORD
