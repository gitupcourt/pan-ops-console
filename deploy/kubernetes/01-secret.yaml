# Edit FERNET_KEY before applying. Generate one with:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# Keep it safe — losing it makes existing stored API credentials unrecoverable.
apiVersion: v1
kind: Secret
metadata:
  name: pan-capacity-secrets
type: Opaque
stringData:
  FERNET_KEY: REPLACE_ME_WITH_A_REAL_FERNET_KEY
