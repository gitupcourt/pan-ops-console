apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pan-ops-console-postgres-data
  labels: { app: pan-ops-console, tier: postgres }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path   # swap for whatever your cluster offers
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pan-ops-console-postgres
  labels: { app: pan-ops-console, tier: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: pan-ops-console, tier: postgres } }
  template:
    metadata: { labels: { app: pan-ops-console, tier: postgres } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER,     valueFrom: { secretKeyRef: { name: pan-ops-console-secrets, key: POSTGRES_USER } } }
            - { name: POSTGRES_DB,       valueFrom: { secretKeyRef: { name: pan-ops-console-secrets, key: POSTGRES_DB } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: pan-ops-console-secrets, key: POSTGRES_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready","-U","panops","-d","panops"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "2",  memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: pan-ops-console-postgres-data }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, labels: { app: pan-ops-console, tier: postgres } }
spec:
  selector: { app: pan-ops-console, tier: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
