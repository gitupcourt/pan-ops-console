# Persistent storage for SQLite. Without this the DB resets every time the
# backend pod restarts, which means losing all device inventory + samples.
# Swap storageClassName for whatever your cluster offers.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pan-capacity-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
