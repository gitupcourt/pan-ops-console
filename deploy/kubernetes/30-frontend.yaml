apiVersion: apps/v1
kind: Deployment
metadata:
  name: pan-capacity-frontend
  labels:
    app: pan-capacity
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: pan-capacity, tier: frontend }
  template:
    metadata:
      labels: { app: pan-capacity, tier: frontend }
    spec:
      containers:
        - name: frontend
          # nginx serving the static Vite build. Built from frontend/Dockerfile.prod.
          image: ghcr.io/gitupcourt/pan-capacity-analyzer-frontend:latest
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pan-capacity-frontend
spec:
  selector: { app: pan-capacity, tier: frontend }
  ports: [{ port: 80, targetPort: 80 }]
