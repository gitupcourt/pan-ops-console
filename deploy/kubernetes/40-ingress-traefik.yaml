# Example Traefik ingress. If you use nginx-ingress or another controller,
# the equivalent is: route /api/* to the backend with prefix stripped, and
# everything else to the frontend.
#
# REPLACE capacity.example.com with your real hostname.
# REPLACE secretName with your real TLS secret (cert-manager, manual, etc.)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
spec:
  stripPrefix:
    prefixes: ["/api"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pan-capacity-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [capacity.example.com]
      secretName: capacity-tls
  rules:
    - host: capacity.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pan-capacity-backend
                port: { number: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pan-capacity-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [capacity.example.com]
      secretName: capacity-tls
  rules:
    - host: capacity.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pan-capacity-frontend
                port: { number: 80 }
