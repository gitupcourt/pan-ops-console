# Dev docker-compose for local "kick the tires" use.
#
# Containers run as a non-root user (UID 10001). To avoid the bind-mount
# permission dance that non-root containers introduce, this file uses
# Docker NAMED VOLUMES for any data persistence. The volumes are created
# and managed by Docker; you don't need to chown anything on the host.
#
# If you want live-reload of source code you have two options:
#   1) `docker compose watch` (Compose v2.22+, native file sync)
#   2) Add a `docker-compose.override.yml` with bind mounts AND
#      `sudo chown -R 10001:10001 ./backend ./frontend` first.
# The Tilt dev loop on the homelab cluster does live source sync into the
# pod, which is the recommended path for active development.

services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      # SQLite + any other backend state
      - capacity-data:/app/data
      # Metric catalog is read-only and shipped with the repo; bind-mount is fine
      - ./catalog:/app/catalog:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    # node_modules lives in a named volume so the container's pre-installed
    # tree isn't shadowed by whatever the host has (or doesn't have).
    volumes:
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  capacity-data:
  frontend-node-modules:
