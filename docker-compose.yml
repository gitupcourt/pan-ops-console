services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./catalog:/app/catalog:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
